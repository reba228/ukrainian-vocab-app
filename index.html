<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4A90E2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ukrainian Vocabulary</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .flashcard-container {
            perspective: 1000px;
            margin-bottom: 30px;
            height: 300px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .card-word {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .card-label {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-pronunciation {
            font-size: 16px;
            opacity: 0.9;
            font-style: italic;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .btn-prev {
            background: #e0e0e0;
            color: #333;
        }

        .btn-next {
            background: #4CAF50;
            color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:active {
            background: #667eea;
            color: white;
        }

        .add-word-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .tap-hint {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 20px;
            }

            .card-word {
                font-size: 36px;
            }

            .flashcard-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const APP_VERSION = '1.4.0';
        const APP_UPDATED = '2026-02-17';

        // Initial Ukrainian vocabulary
        const initialVocabulary = [
            { ukrainian: "Привіт", english: "Hello", pronunciation: "pry-vit", confidence: 0, reviewCount: 0 },
            { ukrainian: "Дякую", english: "Thank you", pronunciation: "dya-ku-yu", confidence: 0, reviewCount: 0 },
            { ukrainian: "Так", english: "Yes", pronunciation: "tak", confidence: 0, reviewCount: 0 },
            { ukrainian: "Ні", english: "No", pronunciation: "ni", confidence: 0, reviewCount: 0 },
            { ukrainian: "Будь ласка", english: "Please", pronunciation: "bud' las-ka", confidence: 0, reviewCount: 0 },
            { ukrainian: "Вибачте", english: "Excuse me", pronunciation: "vy-bach-te", confidence: 0, reviewCount: 0 },
            { ukrainian: "До побачення", english: "Goodbye", pronunciation: "do po-ba-chen-nya", confidence: 0, reviewCount: 0 },
            { ukrainian: "Доброго ранку", english: "Good morning", pronunciation: "do-bro-ho ran-ku", confidence: 0, reviewCount: 0 },
            { ukrainian: "Добрий день", english: "Good afternoon", pronunciation: "do-bryy den'" , confidence: 0, reviewCount: 0 },
            { ukrainian: "Добрий вечір", english: "Good evening", pronunciation: "do-bryy ve-chir", confidence: 0, reviewCount: 0 },
            { ukrainian: "Як справи?", english: "How are you?", pronunciation: "yak spra-vy", confidence: 0, reviewCount: 0 },
            { ukrainian: "Добре", english: "Good/Fine", pronunciation: "do-bre", confidence: 0, reviewCount: 0 },
            { ukrainian: "Погано", english: "Bad", pronunciation: "po-ha-no", confidence: 0, reviewCount: 0 },
            { ukrainian: "Я не розумію", english: "I don't understand", pronunciation: "ya ne ro-zu-mi-yu", confidence: 0, reviewCount: 0 },
            { ukrainian: "Допоможіть", english: "Help", pronunciation: "do-po-mo-zhit'", confidence: 0, reviewCount: 0 },
            { ukrainian: "Вода", english: "Water", pronunciation: "vo-da", confidence: 0, reviewCount: 0 },
            { ukrainian: "Їжа", english: "Food", pronunciation: "yi-zha", confidence: 0, reviewCount: 0 },
            { ukrainian: "Дім", english: "House/Home", pronunciation: "dim", confidence: 0, reviewCount: 0 },
            { ukrainian: "Любов", english: "Love", pronunciation: "lyu-bov", confidence: 0, reviewCount: 0 },
            { ukrainian: "Друг", english: "Friend", pronunciation: "druh", confidence: 0, reviewCount: 0 },
        ];

        function Flashcard({ word, isFlipped, onFlip, onRate, frontLanguage }) {
            const getConfidenceBadge = (confidence) => {
                const badges = [
                    { emoji: '🆕', label: 'New', color: '#999' },
                    { emoji: '📚', label: 'Learning', color: '#f5576c' },
                    { emoji: '👍', label: 'Familiar', color: '#FFA726' },
                    { emoji: '✅', label: 'Mastered', color: '#4CAF50' }
                ];
                return badges[confidence || 0];
            };

            const badge = getConfidenceBadge(word.confidence);
            const showUkrainianFirst = frontLanguage === 'uk';

            const frontContent = showUkrainianFirst ? (
                <>
                    <div className="card-label">Ukrainian</div>
                    <div className="card-word">{word.ukrainian}</div>
                    {word.pronunciation && (
                        <div className="card-pronunciation">[{word.pronunciation}]</div>
                    )}
                </>
            ) : (
                <>
                    <div className="card-label">English</div>
                    <div className="card-word">{word.english}</div>
                </>
            );

            const backContent = showUkrainianFirst ? (
                <>
                    <div className="card-label">English</div>
                    <div className="card-word">{word.english}</div>
                </>
            ) : (
                <>
                    <div className="card-label">Ukrainian</div>
                    <div className="card-word">{word.ukrainian}</div>
                    {word.pronunciation && (
                        <div className="card-pronunciation">[{word.pronunciation}]</div>
                    )}
                </>
            );

            return (
                <>
                    <div className="flashcard-container" onClick={onFlip}>
                        <div className={`flashcard ${isFlipped ? 'flipped' : ''}`}>
                            <div className="card-face card-front">
                                <div style={{ position: 'absolute', top: '15px', right: '15px', fontSize: '24px' }}>
                                    {badge.emoji}
                                </div>
                                {frontContent}
                            </div>
                            <div className="card-face card-back">
                                <div style={{ position: 'absolute', top: '15px', right: '15px', fontSize: '24px' }}>
                                    {badge.emoji}
                                </div>
                                {backContent}
                            </div>
                        </div>
                    </div>

                    {isFlipped && (
                        <div style={{
                            display: 'flex',
                            gap: '10px',
                            marginTop: '15px',
                            justifyContent: 'center'
                        }}>
                            <button
                                className="btn"
                                style={{
                                    background: '#f5576c',
                                    color: 'white',
                                    padding: '12px 20px',
                                    flex: 1,
                                    maxWidth: '150px'
                                }}
                                onClick={(e) => { e.stopPropagation(); onRate(0); }}
                            >
                                😕 Hard
                            </button>
                            <button
                                className="btn"
                                style={{
                                    background: '#FFA726',
                                    color: 'white',
                                    padding: '12px 20px',
                                    flex: 1,
                                    maxWidth: '150px'
                                }}
                                onClick={(e) => { e.stopPropagation(); onRate(1); }}
                            >
                                😐 OK
                            </button>
                            <button
                                className="btn"
                                style={{
                                    background: '#4CAF50',
                                    color: 'white',
                                    padding: '12px 20px',
                                    flex: 1,
                                    maxWidth: '150px'
                                }}
                                onClick={(e) => { e.stopPropagation(); onRate(2); }}
                            >
                                😊 Easy
                            </button>
                        </div>
                    )}
                </>
            );
        }

        function AddWordForm({ onAdd, onCancel }) {
            const [mode, setMode] = useState('translate'); // 'translate' or 'manual'
            const [ukrainian, setUkrainian] = useState('');
            const [english, setEnglish] = useState('');
            const [pronunciation, setPronunciation] = useState('');
            const [isTranslating, setIsTranslating] = useState(false);
            const [translationError, setTranslationError] = useState('');

            const translateToUkrainian = async (englishText) => {
                if (!englishText.trim()) {
                    setUkrainian('');
                    return;
                }

                setIsTranslating(true);
                setTranslationError('');

                try {
                    const response = await fetch(
                        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(englishText)}&langpair=en|uk`
                    );
                    const data = await response.json();

                    if (data.responseStatus === 200 && data.responseData.translatedText) {
                        setUkrainian(data.responseData.translatedText);
                    } else {
                        setTranslationError('Translation failed. Please enter manually.');
                    }
                } catch (error) {
                    setTranslationError('Translation service unavailable. Please enter manually.');
                } finally {
                    setIsTranslating(false);
                }
            };

            const handleEnglishChange = (e) => {
                const text = e.target.value;
                setEnglish(text);

                if (mode === 'translate') {
                    // Debounce translation
                    clearTimeout(window.translationTimeout);
                    window.translationTimeout = setTimeout(() => {
                        translateToUkrainian(text);
                    }, 500);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (ukrainian.trim() && english.trim()) {
                    onAdd({ ukrainian, english, pronunciation });
                    setUkrainian('');
                    setEnglish('');
                    setPronunciation('');
                    setTranslationError('');
                }
            };

            return (
                <div className="add-word-form">
                    <div className="form-title">Add New Word</div>

                    <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                        <button
                            type="button"
                            className={mode === 'translate' ? 'btn btn-next' : 'btn-secondary'}
                            style={{ flex: 1, padding: '10px' }}
                            onClick={() => setMode('translate')}
                        >
                            🌐 Auto-translate
                        </button>
                        <button
                            type="button"
                            className={mode === 'manual' ? 'btn btn-next' : 'btn-secondary'}
                            style={{ flex: 1, padding: '10px' }}
                            onClick={() => setMode('manual')}
                        >
                            ✍️ Manual Entry
                        </button>
                    </div>

                    <form onSubmit={handleSubmit}>
                        {mode === 'translate' ? (
                            <>
                                <div className="form-group">
                                    <label className="form-label">English Word or Phrase</label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={english}
                                        onChange={handleEnglishChange}
                                        placeholder="Hello"
                                        required
                                    />
                                    {isTranslating && (
                                        <div style={{ fontSize: '12px', color: '#4CAF50', marginTop: '5px' }}>
                                            Translating...
                                        </div>
                                    )}
                                    {translationError && (
                                        <div style={{ fontSize: '12px', color: '#f5576c', marginTop: '5px' }}>
                                            {translationError}
                                        </div>
                                    )}
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Ukrainian Translation (edit if needed)</label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={ukrainian}
                                        onChange={(e) => setUkrainian(e.target.value)}
                                        placeholder="Привіт"
                                        required
                                        style={{ background: ukrainian ? '#f0fff4' : 'white' }}
                                    />
                                </div>
                            </>
                        ) : (
                            <>
                                <div className="form-group">
                                    <label className="form-label">Ukrainian Word</label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={ukrainian}
                                        onChange={(e) => setUkrainian(e.target.value)}
                                        placeholder="Привіт"
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">English Translation</label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={english}
                                        onChange={(e) => setEnglish(e.target.value)}
                                        placeholder="Hello"
                                        required
                                    />
                                </div>
                            </>
                        )}

                        <div className="form-group">
                            <label className="form-label">Pronunciation (optional)</label>
                            <input
                                type="text"
                                className="form-input"
                                value={pronunciation}
                                onChange={(e) => setPronunciation(e.target.value)}
                                placeholder="pry-vit"
                            />
                        </div>
                        <div className="form-actions">
                            <button type="button" className="btn btn-prev" onClick={onCancel}>
                                Cancel
                            </button>
                            <button type="submit" className="btn btn-next">
                                Add Word
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function ImportWordsForm({ onImport, onCancel }) {
            const [importText, setImportText] = useState('');
            const [preview, setPreview] = useState([]);

            const parseImportText = (text) => {
                const lines = text.trim().split('\n').filter(line => line.trim());
                const words = [];

                for (const line of lines) {
                    // Support multiple formats:
                    // Format 1: Ukrainian | English | pronunciation
                    // Format 2: Ukrainian, English, pronunciation
                    // Format 3: Ukrainian - English
                    // Format 4: Ukrainian	English	pronunciation (tab-separated)

                    let parts;
                    if (line.includes('|')) {
                        parts = line.split('|').map(p => p.trim());
                    } else if (line.includes('\t')) {
                        parts = line.split('\t').map(p => p.trim());
                    } else if (line.includes(',')) {
                        parts = line.split(',').map(p => p.trim());
                    } else if (line.includes(' - ')) {
                        parts = line.split(' - ').map(p => p.trim());
                    } else {
                        continue; // Skip lines that don't match any format
                    }

                    if (parts.length >= 2) {
                        words.push({
                            ukrainian: parts[0],
                            english: parts[1],
                            pronunciation: parts[2] || ''
                        });
                    }
                }

                return words;
            };

            const handleTextChange = (e) => {
                const text = e.target.value;
                setImportText(text);
                setPreview(parseImportText(text));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (preview.length > 0) {
                    onImport(preview);
                    setImportText('');
                    setPreview([]);
                }
            };

            return (
                <div className="add-word-form">
                    <div className="form-title">Import Words</div>
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label className="form-label">
                                Paste your vocabulary (one per line)
                            </label>
                            <textarea
                                className="form-input"
                                style={{ minHeight: '150px', fontFamily: 'monospace', fontSize: '14px' }}
                                value={importText}
                                onChange={handleTextChange}
                                placeholder={"Supported formats:\nПривіт | Hello | pry-vit\nДякую, Thank you, dya-ku-yu\nТак - Yes\nНі	No	ni"}
                                rows="8"
                            />
                            <div style={{ fontSize: '12px', color: '#666', marginTop: '5px' }}>
                                Formats: Ukrainian | English | pronunciation<br/>
                                or: Ukrainian, English, pronunciation<br/>
                                or: Ukrainian - English
                            </div>
                        </div>
                        {preview.length > 0 && (
                            <div className="form-group">
                                <div style={{ fontSize: '14px', color: '#4CAF50', fontWeight: '600', marginBottom: '5px' }}>
                                    Preview: {preview.length} word{preview.length !== 1 ? 's' : ''} will be imported
                                </div>
                                <div style={{ maxHeight: '120px', overflow: 'auto', fontSize: '13px', padding: '10px', background: '#f9f9f9', borderRadius: '5px' }}>
                                    {preview.slice(0, 5).map((word, idx) => (
                                        <div key={idx} style={{ marginBottom: '5px' }}>
                                            {word.ukrainian} → {word.english}
                                            {word.pronunciation && ` [${word.pronunciation}]`}
                                        </div>
                                    ))}
                                    {preview.length > 5 && <div>... and {preview.length - 5} more</div>}
                                </div>
                            </div>
                        )}
                        <div className="form-actions">
                            <button type="button" className="btn btn-prev" onClick={onCancel}>
                                Cancel
                            </button>
                            <button
                                type="submit"
                                className="btn btn-next"
                                disabled={preview.length === 0}
                            >
                                Import {preview.length > 0 && `(${preview.length})`}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function App() {
            const [vocabulary, setVocabulary] = useState(() => {
                const saved = localStorage.getItem('ukrainianVocabulary');
                const words = saved ? JSON.parse(saved) : initialVocabulary;
                // Ensure all words have confidence tracking
                return words.map(word => ({
                    ...word,
                    confidence: word.confidence !== undefined ? word.confidence : 0,
                    reviewCount: word.reviewCount || 0
                }));
            });
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [showAddForm, setShowAddForm] = useState(false);
            const [showImportForm, setShowImportForm] = useState(false);
            const [sortMode, setSortMode] = useState('smart');
            const [studyMode, setStudyMode] = useState('mixed'); // 'uk-en', 'en-uk', 'mixed'
            const [cardFront, setCardFront] = useState('uk'); // what's shown on front for current card

            const getCardFront = (mode) => {
                if (mode === 'uk-en') return 'uk';
                if (mode === 'en-uk') return 'en';
                return Math.random() < 0.5 ? 'uk' : 'en'; // mixed
            };

            useEffect(() => {
                localStorage.setItem('ukrainianVocabulary', JSON.stringify(vocabulary));
            }, [vocabulary]);

            // Smart sort: prioritize lower confidence words
            useEffect(() => {
                if (sortMode === 'smart') {
                    const sorted = [...vocabulary].sort((a, b) => {
                        // First by confidence (lower first)
                        if (a.confidence !== b.confidence) {
                            return a.confidence - b.confidence;
                        }
                        // Then by review count (less reviewed first)
                        return a.reviewCount - b.reviewCount;
                    });
                    setVocabulary(sorted);
                    setCurrentIndex(0);
                }
            }, [sortMode]);

            const handleNext = () => {
                setIsFlipped(false);
                setCardFront(getCardFront(studyMode));
                setCurrentIndex((prev) => (prev + 1) % vocabulary.length);
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setCardFront(getCardFront(studyMode));
                setCurrentIndex((prev) => (prev - 1 + vocabulary.length) % vocabulary.length);
            };

            const handleFlip = () => {
                setIsFlipped(!isFlipped);
            };

            const handleStudyMode = (mode) => {
                setStudyMode(mode);
                setCardFront(getCardFront(mode));
                setIsFlipped(false);
            };

            const handleRate = (difficulty) => {
                // difficulty: 0 = hard, 1 = ok, 2 = easy
                const updatedVocab = [...vocabulary];
                const currentWord = updatedVocab[currentIndex];

                // Update confidence based on difficulty
                if (difficulty === 0) {
                    // Hard: decrease or keep at 0
                    currentWord.confidence = Math.max(0, currentWord.confidence - 1);
                } else if (difficulty === 1) {
                    // OK: increase slightly
                    currentWord.confidence = Math.min(3, currentWord.confidence + 1);
                } else {
                    // Easy: increase more
                    currentWord.confidence = Math.min(3, currentWord.confidence + 2);
                }

                currentWord.reviewCount = (currentWord.reviewCount || 0) + 1;
                setVocabulary(updatedVocab);

                // Auto-advance to next card
                setTimeout(() => {
                    handleNext();
                }, 300);
            };

            const handleShuffle = () => {
                const shuffled = [...vocabulary].sort(() => Math.random() - 0.5);
                setVocabulary(shuffled);
                setCurrentIndex(0);
                setIsFlipped(false);
                setSortMode('shuffle');
            };

            const handleSmartSort = () => {
                setSortMode('smart');
            };

            const handleAddWord = (newWord) => {
                const wordWithTracking = {
                    ...newWord,
                    confidence: 0,
                    reviewCount: 0
                };
                setVocabulary([...vocabulary, wordWithTracking]);
                setShowAddForm(false);
            };

            const handleImportWords = (words) => {
                const wordsWithTracking = words.map(word => ({
                    ...word,
                    confidence: 0,
                    reviewCount: 0
                }));
                setVocabulary([...vocabulary, ...wordsWithTracking]);
                setShowImportForm(false);
            };

            const handleReset = () => {
                if (confirm('Reset to default vocabulary? Your custom words will be removed.')) {
                    setVocabulary(initialVocabulary);
                    setCurrentIndex(0);
                    setIsFlipped(false);
                }
            };

            if (vocabulary.length === 0) {
                return (
                    <div className="app-container">
                        <div className="header">
                            <h1>🇺🇦 Ukrainian Vocabulary</h1>
                            <p>No words yet. Add your first word!</p>
                        </div>
                        <AddWordForm
                            onAdd={handleAddWord}
                            onCancel={() => {}}
                        />
                    </div>
                );
            }

            const masteredCount = vocabulary.filter(w => w.confidence === 3).length;
            const familiarCount = vocabulary.filter(w => w.confidence === 2).length;
            const learningCount = vocabulary.filter(w => w.confidence === 1).length;
            const newCount = vocabulary.filter(w => w.confidence === 0).length;

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🇺🇦 Ukrainian Vocabulary</h1>
                        <div className="progress">
                            Card {currentIndex + 1} of {vocabulary.length}
                            {sortMode === 'smart' && ' · Smart Sort'}
                        </div>
                        <div style={{
                            display: 'flex',
                            gap: '8px',
                            justifyContent: 'center',
                            marginTop: '8px',
                            fontSize: '13px'
                        }}>
                            <span style={{ color: '#999' }}>🆕 {newCount}</span>
                            <span style={{ color: '#f5576c' }}>📚 {learningCount}</span>
                            <span style={{ color: '#FFA726' }}>👍 {familiarCount}</span>
                            <span style={{ color: '#4CAF50' }}>✅ {masteredCount}</span>
                        </div>
                        <div style={{ fontSize: '11px', color: '#bbb', marginTop: '6px' }}>
                            v{APP_VERSION} · {APP_UPDATED}
                        </div>
                    </div>

                    <div style={{ display: 'flex', gap: '6px', marginBottom: '12px', justifyContent: 'center' }}>
                        {[
                            { key: 'uk-en', label: '🇺🇦→🇬🇧' },
                            { key: 'mixed', label: '🔀 Mixed' },
                            { key: 'en-uk', label: '🇬🇧→🇺🇦' },
                        ].map(({ key, label }) => (
                            <button
                                key={key}
                                onClick={() => handleStudyMode(key)}
                                style={{
                                    padding: '7px 12px',
                                    border: `2px solid ${studyMode === key ? '#667eea' : '#ddd'}`,
                                    borderRadius: '8px',
                                    background: studyMode === key ? '#667eea' : 'white',
                                    color: studyMode === key ? 'white' : '#666',
                                    fontWeight: studyMode === key ? '600' : '400',
                                    fontSize: '13px',
                                    cursor: 'pointer',
                                }}
                            >
                                {label}
                            </button>
                        ))}
                    </div>

                    <Flashcard
                        word={vocabulary[currentIndex]}
                        isFlipped={isFlipped}
                        onFlip={handleFlip}
                        onRate={handleRate}
                        frontLanguage={cardFront}
                    />

                    {!isFlipped && (
                        <div className="tap-hint">
                            Tap card to flip
                        </div>
                    )}

                    <div className="controls" style={{ marginTop: isFlipped ? '15px' : '5px' }}>
                        <button className="btn btn-prev" onClick={handlePrev}>
                            ← Previous
                        </button>
                        <button className="btn btn-next" onClick={handleNext}>
                            Next →
                        </button>
                    </div>

                    <div className="secondary-controls">
                        <button
                            className="btn-secondary"
                            onClick={handleSmartSort}
                            style={{ borderColor: sortMode === 'smart' ? '#4CAF50' : '#667eea', color: sortMode === 'smart' ? '#4CAF50' : '#667eea' }}
                        >
                            🧠 Smart
                        </button>
                        <button className="btn-secondary" onClick={handleShuffle}>
                            🔀 Shuffle
                        </button>
                        <button className="btn-secondary" onClick={() => {
                            setShowAddForm(!showAddForm);
                            setShowImportForm(false);
                        }}>
                            ➕ Add Word
                        </button>
                        <button className="btn-secondary" onClick={() => {
                            setShowImportForm(!showImportForm);
                            setShowAddForm(false);
                        }}>
                            📥 Import
                        </button>
                        <button className="btn-secondary" onClick={handleReset}>
                            🔄 Reset
                        </button>
                    </div>

                    {showAddForm && (
                        <AddWordForm
                            onAdd={handleAddWord}
                            onCancel={() => setShowAddForm(false)}
                        />
                    )}

                    {showImportForm && (
                        <ImportWordsForm
                            onImport={handleImportWords}
                            onCancel={() => setShowImportForm(false)}
                        />
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
