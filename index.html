<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4A90E2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ukrainian Vocabulary</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .flashcard-container {
            perspective: 1000px;
            margin-bottom: 30px;
            height: 300px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .card-word {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .card-label {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-pronunciation {
            font-size: 16px;
            opacity: 0.9;
            font-style: italic;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .btn-prev {
            background: #e0e0e0;
            color: #333;
        }

        .btn-next {
            background: #4CAF50;
            color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: calc(33% - 10px);
        }

        .btn-secondary:active {
            background: #667eea;
            color: white;
        }

        .add-word-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .tap-hint {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 20px;
            }

            .card-word {
                font-size: 36px;
            }

            .flashcard-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Initialize Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2a8jEZMsUoHjipUvArKNh6xPExf_HIg0",
            authDomain: "ukrainian-vocab.firebaseapp.com",
            projectId: "ukrainian-vocab",
            storageBucket: "ukrainian-vocab.firebasestorage.app",

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const APP_VERSION = '1.5.0';
        const APP_UPDATED = '2026-02-17';

        const initialVocabulary = [
            { ukrainian: "Привіт", english: "Hello", pronunciation: "pry-vit", confidence: 0, reviewCount: 0 },
            { ukrainian: "Дякую", english: "Thank you", pronunciation: "dya-ku-yu", confidence: 0, reviewCount: 0 },
            { ukrainian: "Так", english: "Yes", pronunciation: "tak", confidence: 0, reviewCount: 0 },
            { ukrainian: "Ні", english: "No", pronunciation: "ni", confidence: 0, reviewCount: 0 },
            { ukrainian: "Будь ласка", english: "Please", pronunciation: "bud' las-ka", confidence: 0, reviewCount: 0 },
            { ukrainian: "Вибачте", english: "Excuse me", pronunciation: "vy-bach-te", confidence: 0, reviewCount: 0 },
            { ukrainian: "До побачення", english: "Goodbye", pronunciation: "do po-ba-chen-nya", confidence: 0, reviewCount: 0 },
            { ukrainian: "Доброго ранку", english: "Good morning", pronunciation: "do-bro-ho ran-ku", confidence: 0, reviewCount: 0 },
            { ukrainian: "Добрий день", english: "Good afternoon", pronunciation: "do-bryy den'", confidence: 0, reviewCount: 0 },
            { ukrainian: "Добрий вечір", english: "Good evening", pronunciation: "do-bryy ve-chir", confidence: 0, reviewCount: 0 },
            { ukrainian: "Як справи?", english: "How are you?", pronunciation: "yak spra-vy", confidence: 0, reviewCount: 0 },
            { ukrainian: "Добре", english: "Good/Fine", pronunciation: "do-bre", confidence: 0, reviewCount: 0 },
            { ukrainian: "Погано", english: "Bad", pronunciation: "po-ha-no", confidence: 0, reviewCount: 0 },
            { ukrainian: "Я не розумію", english: "I don't understand", pronunciation: "ya ne ro-zu-mi-yu", confidence: 0, reviewCount: 0 },
            { ukrainian: "Допоможіть", english: "Help", pronunciation: "do-po-mo-zhit'", confidence: 0, reviewCount: 0 },
            { ukrainian: "Вода", english: "Water", pronunciation: "vo-da", confidence: 0, reviewCount: 0 },
            { ukrainian: "Їжа", english: "Food", pronunciation: "yi-zha", confidence: 0, reviewCount: 0 },
            { ukrainian: "Дім", english: "House/Home", pronunciation: "dim", confidence: 0, reviewCount: 0 },
            { ukrainian: "Любов", english: "Love", pronunciation: "lyu-bov", confidence: 0, reviewCount: 0 },
            { ukrainian: "Друг", english: "Friend", pronunciation: "druh", confidence: 0, reviewCount: 0 },
        ];

        // ─── Loading Screen ───────────────────────────────────────────────
        function LoadingScreen({ message }) {
            return (
                <div className="app-container" style={{ textAlign: 'center', padding: '60px 30px' }}>
                    <div className="spinner"></div>
                    <div style={{ color: '#666', fontSize: '15px' }}>{message || 'Loading...'}</div>
                </div>
            );
        }

        // ─── Sign In Screen ───────────────────────────────────────────────
        function SignInScreen({ onSignIn, error }) {
            return (
                <div className="app-container" style={{ textAlign: 'center', padding: '50px 30px' }}>
                    <div style={{ fontSize: '64px', marginBottom: '16px' }}>🇺🇦</div>
                    <h1 style={{ fontSize: '26px', color: '#333', marginBottom: '8px' }}>Ukrainian Vocabulary</h1>
                    <p style={{ color: '#888', fontSize: '14px', marginBottom: '32px', lineHeight: '1.5' }}>
                        Sign in to sync your vocabulary and<br/>progress across all your devices
                    </p>
                    <button
                        onClick={onSignIn}
                        style={{
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '12px',
                            padding: '14px 28px',
                            background: 'white',
                            border: '2px solid #ddd',
                            borderRadius: '12px',
                            fontSize: '16px',
                            fontWeight: '600',
                            cursor: 'pointer',
                            boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
                            color: '#333',
                        }}
                    >
                        <svg width="20" height="20" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                        </svg>
                        Sign in with Google
                    </button>
                    {error && (
                        <div style={{ marginTop: '16px', color: '#f5576c', fontSize: '13px' }}>
                            {error}
                        </div>
                    )}
                </div>
            );
        }

        // ─── Flashcard ────────────────────────────────────────────────────
        function Flashcard({ word, isFlipped, onFlip, onRate, frontLanguage }) {
            const getConfidenceBadge = (confidence) => {
                const badges = [
                    { emoji: '🆕', label: 'New', color: '#999' },
                    { emoji: '📚', label: 'Learning', color: '#f5576c' },
                    { emoji: '👍', label: 'Familiar', color: '#FFA726' },
                    { emoji: '✅', label: 'Mastered', color: '#4CAF50' }
                ];
                return badges[confidence || 0];
            };

            const badge = getConfidenceBadge(word.confidence);
            const showUkrainianFirst = frontLanguage === 'uk';

            const frontContent = showUkrainianFirst ? (
                <>
                    <div className="card-label">Ukrainian</div>
                    <div className="card-word">{word.ukrainian}</div>
                    {word.pronunciation && (
                        <div className="card-pronunciation">[{word.pronunciation}]</div>
                    )}
                </>
            ) : (
                <>
                    <div className="card-label">English</div>
                    <div className="card-word">{word.english}</div>
                </>
            );

            const backContent = showUkrainianFirst ? (
                <>
                    <div className="card-label">English</div>
                    <div className="card-word">{word.english}</div>
                </>
            ) : (
                <>
                    <div className="card-label">Ukrainian</div>
                    <div className="card-word">{word.ukrainian}</div>
                    {word.pronunciation && (
                        <div className="card-pronunciation">[{word.pronunciation}]</div>
                    )}
                </>
            );

            return (
                <>
                    <div className="flashcard-container" onClick={onFlip}>
                        <div className={`flashcard ${isFlipped ? 'flipped' : ''}`}>
                            <div className="card-face card-front">
                                <div style={{ position: 'absolute', top: '15px', right: '15px', fontSize: '24px' }}>
                                    {badge.emoji}
                                </div>
                                {frontContent}
                            </div>
                            <div className="card-face card-back">
                                <div style={{ position: 'absolute', top: '15px', right: '15px', fontSize: '24px' }}>
                                    {badge.emoji}
                                </div>
                                {backContent}
                            </div>
                        </div>
                    </div>

                    {isFlipped && (
                        <div style={{ display: 'flex', gap: '10px', marginTop: '15px', justifyContent: 'center' }}>
                            <button className="btn" style={{ background: '#f5576c', color: 'white', padding: '12px 20px', flex: 1, maxWidth: '150px' }}
                                onClick={(e) => { e.stopPropagation(); onRate(0); }}>
                                😕 Hard
                            </button>
                            <button className="btn" style={{ background: '#FFA726', color: 'white', padding: '12px 20px', flex: 1, maxWidth: '150px' }}
                                onClick={(e) => { e.stopPropagation(); onRate(1); }}>
                                😐 OK
                            </button>
                            <button className="btn" style={{ background: '#4CAF50', color: 'white', padding: '12px 20px', flex: 1, maxWidth: '150px' }}
                                onClick={(e) => { e.stopPropagation(); onRate(2); }}>
                                😊 Easy
                            </button>
                        </div>
                    )}
                </>
            );
        }

        // ─── Add Word Form ────────────────────────────────────────────────
        function AddWordForm({ onAdd, onCancel, vocabulary }) {
            const [mode, setMode] = useState('translate');
            const [ukrainian, setUkrainian] = useState('');
            const [english, setEnglish] = useState('');
            const [pronunciation, setPronunciation] = useState('');
            const [isTranslating, setIsTranslating] = useState(false);
            const [translationError, setTranslationError] = useState('');

            const findDuplicate = (uk, en) => {
                const ukLower = uk.trim().toLowerCase();
                const enLower = en.trim().toLowerCase();
                return vocabulary.find(w =>
                    w.ukrainian.toLowerCase() === ukLower ||
                    w.english.toLowerCase() === enLower
                );
            };

            const duplicate = (ukrainian || english) ? findDuplicate(ukrainian, english) : null;

            const translateToUkrainian = async (englishText) => {
                if (!englishText.trim()) { setUkrainian(''); return; }
                setIsTranslating(true);
                setTranslationError('');
                try {
                    const response = await fetch(
                        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(englishText)}&langpair=en|uk`
                    );
                    const data = await response.json();
                    if (data.responseStatus === 200 && data.responseData.translatedText) {
                        setUkrainian(data.responseData.translatedText);
                    } else {
                        setTranslationError('Translation failed. Please enter manually.');
                    }
                } catch {
                    setTranslationError('Translation service unavailable. Please enter manually.');
                } finally {
                    setIsTranslating(false);
                }
            };

            const handleEnglishChange = (e) => {
                const text = e.target.value;
                setEnglish(text);
                if (mode === 'translate') {
                    clearTimeout(window.translationTimeout);
                    window.translationTimeout = setTimeout(() => translateToUkrainian(text), 500);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (ukrainian.trim() && english.trim() && !duplicate) {
                    onAdd({ ukrainian, english, pronunciation });
                    setUkrainian(''); setEnglish(''); setPronunciation(''); setTranslationError('');
                }
            };

            return (
                <div className="add-word-form">
                    <div className="form-title">Add New Word</div>
                    <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                        <button type="button" className={mode === 'translate' ? 'btn btn-next' : 'btn-secondary'}
                            style={{ flex: 1, padding: '10px' }} onClick={() => setMode('translate')}>
                            🌐 Auto-translate
                        </button>
                        <button type="button" className={mode === 'manual' ? 'btn btn-next' : 'btn-secondary'}
                            style={{ flex: 1, padding: '10px' }} onClick={() => setMode('manual')}>
                            ✍️ Manual Entry
                        </button>
                    </div>
                    <form onSubmit={handleSubmit}>
                        {mode === 'translate' ? (
                            <>
                                <div className="form-group">
                                    <label className="form-label">English Word or Phrase</label>
                                    <input type="text" className="form-input" value={english}
                                        onChange={handleEnglishChange} placeholder="Hello" required />
                                    {isTranslating && <div style={{ fontSize: '12px', color: '#4CAF50', marginTop: '5px' }}>Translating...</div>}
                                    {translationError && <div style={{ fontSize: '12px', color: '#f5576c', marginTop: '5px' }}>{translationError}</div>}
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Ukrainian Translation (edit if needed)</label>
                                    <input type="text" className="form-input" value={ukrainian}
                                        onChange={(e) => setUkrainian(e.target.value)} placeholder="Привіт" required
                                        style={{ background: ukrainian ? '#f0fff4' : 'white' }} />
                                </div>
                            </>
                        ) : (
                            <>
                                <div className="form-group">
                                    <label className="form-label">Ukrainian Word</label>
                                    <input type="text" className="form-input" value={ukrainian}
                                        onChange={(e) => setUkrainian(e.target.value)} placeholder="Привіт" required />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">English Translation</label>
                                    <input type="text" className="form-input" value={english}
                                        onChange={(e) => setEnglish(e.target.value)} placeholder="Hello" required />
                                </div>
                            </>
                        )}
                        <div className="form-group">
                            <label className="form-label">Pronunciation (optional)</label>
                            <input type="text" className="form-input" value={pronunciation}
                                onChange={(e) => setPronunciation(e.target.value)} placeholder="pry-vit" />
                        </div>
                        {duplicate && (
                            <div style={{ background: '#fff3cd', border: '1px solid #ffc107', borderRadius: '8px',
                                padding: '10px 12px', fontSize: '13px', color: '#856404', marginBottom: '12px' }}>
                                ⚠️ Already exists: <strong>{duplicate.ukrainian}</strong> = {duplicate.english}
                            </div>
                        )}
                        <div className="form-actions">
                            <button type="button" className="btn btn-prev" onClick={onCancel}>Cancel</button>
                            <button type="submit" className="btn btn-next" disabled={!!duplicate}>Add Word</button>
                        </div>
                    </form>
                </div>
            );
        }

        // ─── Import Words Form ────────────────────────────────────────────
        function ImportWordsForm({ onImport, onCancel, vocabulary }) {
            const [importText, setImportText] = useState('');
            const [preview, setPreview] = useState([]);
            const [skippedCount, setSkippedCount] = useState(0);

            const parseImportText = (text) => {
                const lines = text.trim().split('\n').filter(line => line.trim());
                const words = [];
                for (const line of lines) {
                    let parts;
                    if (line.includes('|')) parts = line.split('|').map(p => p.trim());
                    else if (line.includes('\t')) parts = line.split('\t').map(p => p.trim());
                    else if (line.includes(',')) parts = line.split(',').map(p => p.trim());
                    else if (line.includes(' - ')) parts = line.split(' - ').map(p => p.trim());
                    else continue;
                    if (parts.length >= 2) {
                        words.push({ ukrainian: parts[0], english: parts[1], pronunciation: parts[2] || '' });
                    }
                }
                return words;
            };

            const handleTextChange = (e) => {
                const text = e.target.value;
                setImportText(text);
                const parsed = parseImportText(text);
                const unique = parsed.filter(w =>
                    !vocabulary.find(existing =>
                        existing.ukrainian.toLowerCase() === w.ukrainian.trim().toLowerCase() ||
                        existing.english.toLowerCase() === w.english.trim().toLowerCase()
                    )
                );
                setSkippedCount(parsed.length - unique.length);
                setPreview(unique);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (preview.length > 0) {
                    onImport(preview);
                    setImportText(''); setPreview([]);
                }
            };

            return (
                <div className="add-word-form">
                    <div className="form-title">Import Words</div>
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label className="form-label">Paste your vocabulary (one per line)</label>
                            <textarea className="form-input"
                                style={{ minHeight: '150px', fontFamily: 'monospace', fontSize: '14px' }}
                                value={importText} onChange={handleTextChange}
                                placeholder={"Supported formats:\nПривіт | Hello | pry-vit\nДякую, Thank you, dya-ku-yu\nТак - Yes"}
                                rows="8" />
                            <div style={{ fontSize: '12px', color: '#666', marginTop: '5px' }}>
                                Formats: Ukrainian | English | pronunciation
                            </div>
                        </div>
                        {(preview.length > 0 || skippedCount > 0) && (
                            <div className="form-group">
                                <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '5px' }}>
                                    {preview.length > 0 && (
                                        <span style={{ color: '#4CAF50' }}>
                                            {preview.length} word{preview.length !== 1 ? 's' : ''} will be imported
                                        </span>
                                    )}
                                    {skippedCount > 0 && (
                                        <span style={{ color: '#f5576c', marginLeft: preview.length > 0 ? '10px' : 0 }}>
                                            ⚠️ {skippedCount} duplicate{skippedCount !== 1 ? 's' : ''} skipped
                                        </span>
                                    )}
                                </div>
                                <div style={{ maxHeight: '120px', overflow: 'auto', fontSize: '13px',
                                    padding: '10px', background: '#f9f9f9', borderRadius: '5px' }}>
                                    {preview.slice(0, 5).map((word, idx) => (
                                        <div key={idx} style={{ marginBottom: '5px' }}>
                                            {word.ukrainian} → {word.english}
                                            {word.pronunciation && ` [${word.pronunciation}]`}
                                        </div>
                                    ))}
                                    {preview.length > 5 && <div>... and {preview.length - 5} more</div>}
                                </div>
                            </div>
                        )}
                        <div className="form-actions">
                            <button type="button" className="btn btn-prev" onClick={onCancel}>Cancel</button>
                            <button type="submit" className="btn btn-next" disabled={preview.length === 0}>
                                Import {preview.length > 0 && `(${preview.length})`}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ─── Main App ─────────────────────────────────────────────────────
        function App() {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [vocabLoading, setVocabLoading] = useState(false);
            const [signInError, setSignInError] = useState('');
            const [saveStatus, setSaveStatus] = useState(''); // 'saving' | 'saved' | ''

            const [vocabulary, setVocabulary] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [showAddForm, setShowAddForm] = useState(false);
            const [showImportForm, setShowImportForm] = useState(false);
            const [sortMode, setSortMode] = useState('smart');
            const [studyMode, setStudyMode] = useState('mixed');
            const [cardFront, setCardFront] = useState('uk');

            const vocabInitialized = useRef(false);
            const saveTimer = useRef(null);

            // ── Handle redirect result (mobile sign-in) ──
            useEffect(() => {
                firebase.auth().getRedirectResult().catch(e => {
                    if (e.code && e.code !== 'auth/no-redirect-operation') {
                        setSignInError('Sign-in failed. Please try again.');
                        console.error(e);
                    }
                });
            }, []);

            // ── Auth listener ──
            useEffect(() => {
                const unsubscribe = firebase.auth().onAuthStateChanged(async (u) => {
                    setUser(u);
                    setAuthLoading(false);
                    if (u) {
                        vocabInitialized.current = false;
                        setVocabLoading(true);
                        try {
                            const doc = await firebase.firestore()
                                .collection('users').doc(u.uid).get();
                            if (doc.exists && doc.data().words && doc.data().words.length > 0) {
                                const words = doc.data().words.map(w => ({
                                    ...w,
                                    confidence: w.confidence !== undefined ? w.confidence : 0,
                                    reviewCount: w.reviewCount || 0
                                }));
                                setVocabulary(words);
                            } else {
                                setVocabulary(initialVocabulary);
                            }
                        } catch (e) {
                            console.error('Firestore load failed:', e);
                            // Fallback to localStorage
                            const saved = localStorage.getItem('ukrainianVocabulary');
                            setVocabulary(saved ? JSON.parse(saved) : initialVocabulary);
                        }
                        setVocabLoading(false);
                        vocabInitialized.current = true;
                    } else {
                        setVocabulary([]);
                        vocabInitialized.current = false;
                    }
                });
                return unsubscribe;
            }, []);

            // ── Save vocabulary to Firestore on change ──
            useEffect(() => {
                if (!vocabInitialized.current || vocabulary.length === 0 || !user) return;

                setSaveStatus('saving');
                if (saveTimer.current) clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(async () => {
                    try {
                        await firebase.firestore().collection('users').doc(user.uid).set({
                            words: vocabulary,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        setSaveStatus('saved');
                        setTimeout(() => setSaveStatus(''), 2000);
                    } catch (e) {
                        console.error('Firestore save failed:', e);
                        setSaveStatus('');
                    }
                }, 1500);
            }, [vocabulary]);

            // ── Auth handlers ──
            const handleSignIn = async () => {
                setSignInError('');
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await firebase.auth().signInWithRedirect(provider);
                } catch (e) {
                    setSignInError('Sign-in failed. Please try again.');
                    console.error(e);
                }
            };

            const handleSignOut = async () => {
                vocabInitialized.current = false;
                await firebase.auth().signOut();
                setVocabulary([]);
                setCurrentIndex(0);
            };

            // ── Card logic ──
            const getCardFront = (mode) => {
                if (mode === 'uk-en') return 'uk';
                if (mode === 'en-uk') return 'en';
                return Math.random() < 0.5 ? 'uk' : 'en';
            };

            const handleNext = () => {
                setIsFlipped(false);
                setCardFront(getCardFront(studyMode));
                setCurrentIndex((prev) => (prev + 1) % vocabulary.length);
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setCardFront(getCardFront(studyMode));
                setCurrentIndex((prev) => (prev - 1 + vocabulary.length) % vocabulary.length);
            };

            const handleStudyMode = (mode) => {
                setStudyMode(mode);
                setCardFront(getCardFront(mode));
                setIsFlipped(false);
            };

            const handleRate = (difficulty) => {
                const updatedVocab = [...vocabulary];
                const currentWord = updatedVocab[currentIndex];
                if (difficulty === 0) currentWord.confidence = Math.max(0, currentWord.confidence - 1);
                else if (difficulty === 1) currentWord.confidence = Math.min(3, currentWord.confidence + 1);
                else currentWord.confidence = Math.min(3, currentWord.confidence + 2);
                currentWord.reviewCount = (currentWord.reviewCount || 0) + 1;
                setVocabulary(updatedVocab);
                setTimeout(() => handleNext(), 300);
            };

            const handleShuffle = () => {
                const shuffled = [...vocabulary].sort(() => Math.random() - 0.5);
                setVocabulary(shuffled);
                setCurrentIndex(0);
                setIsFlipped(false);
                setSortMode('shuffle');
            };

            const handleSmartSort = () => {
                const sorted = [...vocabulary].sort((a, b) => {
                    if (a.confidence !== b.confidence) return a.confidence - b.confidence;
                    return a.reviewCount - b.reviewCount;
                });
                setVocabulary(sorted);
                setCurrentIndex(0);
                setIsFlipped(false);
                setSortMode('smart');
            };

            const handleAddWord = (newWord) => {
                setVocabulary([...vocabulary, { ...newWord, confidence: 0, reviewCount: 0 }]);
                setShowAddForm(false);
            };

            const handleImportWords = (words) => {
                const wordsWithTracking = words.map(w => ({ ...w, confidence: 0, reviewCount: 0 }));
                setVocabulary([...vocabulary, ...wordsWithTracking]);
                setShowImportForm(false);
            };

            const handleReset = () => {
                if (confirm('Reset to default vocabulary? Your custom words will be removed.')) {
                    setVocabulary(initialVocabulary);
                    setCurrentIndex(0);
                    setIsFlipped(false);
                }
            };

            // ── Render states ──
            if (authLoading) return <LoadingScreen message="Starting..." />;
            if (!user) return <SignInScreen onSignIn={handleSignIn} error={signInError} />;
            if (vocabLoading) return <LoadingScreen message="Loading your vocabulary..." />;

            const masteredCount = vocabulary.filter(w => w.confidence === 3).length;
            const familiarCount = vocabulary.filter(w => w.confidence === 2).length;
            const learningCount = vocabulary.filter(w => w.confidence === 1).length;
            const newCount = vocabulary.filter(w => w.confidence === 0).length;

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🇺🇦 Ukrainian Vocabulary</h1>
                        <div className="progress">
                            Card {currentIndex + 1} of {vocabulary.length}
                            {sortMode === 'smart' && ' · Smart Sort'}
                        </div>
                        <div style={{ display: 'flex', gap: '8px', justifyContent: 'center', marginTop: '8px', fontSize: '13px' }}>
                            <span style={{ color: '#999' }}>🆕 {newCount}</span>
                            <span style={{ color: '#f5576c' }}>📚 {learningCount}</span>
                            <span style={{ color: '#FFA726' }}>👍 {familiarCount}</span>
                            <span style={{ color: '#4CAF50' }}>✅ {masteredCount}</span>
                        </div>
                        {/* User info row */}
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', marginTop: '8px' }}>
                            {user.photoURL && (
                                <img src={user.photoURL} alt="" style={{ width: '20px', height: '20px', borderRadius: '50%' }} />
                            )}
                            <span style={{ fontSize: '11px', color: '#bbb' }}>
                                {user.displayName || user.email}
                            </span>
                            <span style={{ fontSize: '11px', color: '#ccc' }}>·</span>
                            {saveStatus === 'saving' && <span style={{ fontSize: '11px', color: '#aaa' }}>saving...</span>}
                            {saveStatus === 'saved' && <span style={{ fontSize: '11px', color: '#4CAF50' }}>✓ saved</span>}
                            {!saveStatus && (
                                <button onClick={handleSignOut}
                                    style={{ fontSize: '11px', color: '#aaa', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>
                                    Sign out
                                </button>
                            )}
                            <span style={{ fontSize: '11px', color: '#ccc' }}>·</span>
                            <span style={{ fontSize: '11px', color: '#bbb' }}>v{APP_VERSION}</span>
                        </div>
                    </div>

                    {/* Study mode toggle */}
                    <div style={{ display: 'flex', gap: '6px', marginBottom: '12px', justifyContent: 'center' }}>
                        {[
                            { key: 'uk-en', label: '🇺🇦→🇬🇧' },
                            { key: 'mixed', label: '🔀 Mixed' },
                            { key: 'en-uk', label: '🇬🇧→🇺🇦' },
                        ].map(({ key, label }) => (
                            <button key={key} onClick={() => handleStudyMode(key)} style={{
                                padding: '7px 12px',
                                border: `2px solid ${studyMode === key ? '#667eea' : '#ddd'}`,
                                borderRadius: '8px',
                                background: studyMode === key ? '#667eea' : 'white',
                                color: studyMode === key ? 'white' : '#666',
                                fontWeight: studyMode === key ? '600' : '400',
                                fontSize: '13px',
                                cursor: 'pointer',
                            }}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {vocabulary.length > 0 ? (
                        <>
                            <Flashcard
                                word={vocabulary[currentIndex]}
                                isFlipped={isFlipped}
                                onFlip={() => setIsFlipped(!isFlipped)}
                                onRate={handleRate}
                                frontLanguage={cardFront}
                            />
                            {!isFlipped && <div className="tap-hint">Tap card to flip</div>}
                            <div className="controls" style={{ marginTop: isFlipped ? '15px' : '5px' }}>
                                <button className="btn btn-prev" onClick={handlePrev}>← Previous</button>
                                <button className="btn btn-next" onClick={handleNext}>Next →</button>
                            </div>
                        </>
                    ) : (
                        <div style={{ textAlign: 'center', color: '#888', padding: '40px 0' }}>
                            No words yet. Add your first word below!
                        </div>
                    )}

                    <div className="secondary-controls">
                        <button className="btn-secondary" onClick={handleSmartSort}
                            style={{ borderColor: sortMode === 'smart' ? '#4CAF50' : '#667eea', color: sortMode === 'smart' ? '#4CAF50' : '#667eea' }}>
                            🧠 Smart
                        </button>
                        <button className="btn-secondary" onClick={handleShuffle}>🔀 Shuffle</button>
                        <button className="btn-secondary" onClick={() => { setShowAddForm(!showAddForm); setShowImportForm(false); }}>
                            ➕ Add Word
                        </button>
                        <button className="btn-secondary" onClick={() => { setShowImportForm(!showImportForm); setShowAddForm(false); }}>
                            📥 Import
                        </button>
                        <button className="btn-secondary" onClick={handleReset}>🔄 Reset</button>
                    </div>

                    {showAddForm && (
                        <AddWordForm onAdd={handleAddWord} onCancel={() => setShowAddForm(false)} vocabulary={vocabulary} />
                    )}
                    {showImportForm && (
                        <ImportWordsForm onImport={handleImportWords} onCancel={() => setShowImportForm(false)} vocabulary={vocabulary} />
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
